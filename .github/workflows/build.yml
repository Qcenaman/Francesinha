name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Version
        id: v
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
          cp app/build/outputs/apk/release/app-release.apk "Francesinha-$V.apk"
          git log -1 --format=%b | grep -vE "^(Co-Authored-By|Claude-Session):" > notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: Francesinha-apk
          path: Francesinha-*.apk

      - name: Release
        if: github.event_name == 'push' && steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Francesinha ${{ steps.v.outputs.version }}
          body_path: notes.md
          target_commitish: ${{ github.sha }}
          files: Francesinha-*.apk
